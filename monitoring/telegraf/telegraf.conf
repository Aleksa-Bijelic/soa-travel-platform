# Telegraf collects per-container metrics straight from the Docker Engine API
# (works with any Docker version / image store) and exposes them for Prometheus.

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "15s"
  precision = "0s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  perdevice_include = ["cpu", "network"]
  total_include = ["cpu", "blkio"]
  docker_label_include = ["com.docker.compose.service"]
  timeout = "5s"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
