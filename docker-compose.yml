x-logging: &fluent-bit
  driver: fluentd
  options:
    fluentd-address: ${FLUENT_BIT_ADDRESS:-127.0.0.1}:24224
    fluentd-async: "true"
    fluentd-max-retries: "3"

services:
  stakeholders-app:
    build:
      context: .
      dockerfile: ./stakeholders-service/Dockerfile
    container_name: stakeholders-app
    restart: on-failure
    networks:
      - servers
    environment:
      DB_HOST: stakeholders-db
      DB_PORT: 5432
      DB_USER: ${STAKEHOLDERS_DB_USER:-postgres}
      DB_PASSWORD: ${STAKEHOLDERS_DB_PASSWORD:-postgres}
      DB_NAME: ${STAKEHOLDERS_DB_NAME:-stakeholders}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      FOLLOWERS_GRPC_ADDR: followers-app:50051
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      NATS_HOST: ${NATS_HOST:-nats}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_USER: ${NATS_USER:-natscon}
      NATS_PASSWORD: ${NATS_PASSWORD:-admin}
    depends_on:
      followers-app:
        condition: service_started
      stakeholders-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./stakeholders-service/uploads:/app/stakeholders-service/uploads
    logging: *fluent-bit

  stakeholders-db:
    container_name: stakeholders-db
    image: postgres:16-alpine
    restart: always
    networks:
      - servers
    environment:
      POSTGRES_USER: ${STAKEHOLDERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${STAKEHOLDERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${STAKEHOLDERS_DB_NAME:-stakeholders}
    ports:
      - "5433:5432"
    volumes:
      - stakeholders_pg_data:/var/lib/postgresql/data
      - ./init/postgres/stakeholders:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAKEHOLDERS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *fluent-bit

  blog-app:
    build:
      context: .
      dockerfile: ./blog-service/Dockerfile
    container_name: blog-app
    restart: on-failure
    networks:
      - servers
    environment:
      DB_HOST: blog-db
      DB_PORT: ${BLOG_DB_PORT:-27017}
      DB_USER: ${BLOG_DB_USER:-postgres}
      DB_PASSWORD: ${BLOG_DB_PASSWORD:-postgres}
      DB_NAME: ${BLOG_DB_NAME:-blog}
      JWT_SECRET: ${JWT_SECRET}
      FOLLOWERS_GRPC_HOST: followers-app
      FOLLOWERS_GRPC_PORT: 50051
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      blog-db:
        condition: service_healthy
      followers-app:
        condition: service_started
    logging: *fluent-bit

  tour-app:
    build:
      context: .
      dockerfile: tour-service/Dockerfile
    container_name: tour-app
    restart: on-failure
    networks:
      - servers
    environment:
      DB_HOST: tour-db
      DB_PORT: 5432
      DB_USER: ${TOUR_DB_USER:-postgres}
      DB_PASSWORD: ${TOUR_DB_PASSWORD:-postgres}
      DB_NAME: ${TOUR_DB_NAME:-tourdb}
      JWT_SECRET: ${JWT_SECRET}
      PURCHASE_GRPC_ADDR: http://purchase-app:50051
      STAKEHOLDERS_GRPC_ADDR: http://stakeholders-app:50051
      TOUR_SERVICE_GRPC_ADDR: tour-app:50051
      ASPNETCORE_URLS: http://+:8080
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      NATS_HOST: ${NATS_HOST:-nats}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_USER: ${NATS_USER:-natscon}
      NATS_PASSWORD: ${NATS_PASSWORD:-admin}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      tour-db:
        condition: service_healthy
      purchase-app:
        condition: service_started
      nats:
        condition: service_healthy
    logging: *fluent-bit

  tour-db:
    container_name: tour-db
    image: postgres:16-alpine
    restart: always
    networks:
      - servers
    environment:
      POSTGRES_USER: ${TOUR_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TOUR_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TOUR_DB_NAME:-tourdb}
    ports:
      - "5435:5432"
    volumes:
      - tour_pg_data:/var/lib/postgresql/data
      - ./init/postgres/tours:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOUR_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *fluent-bit

  purchase-app:
    build:
      context: .
      dockerfile: ./purchase-service/Dockerfile
    container_name: purchase-app
    restart: on-failure
    networks:
      - servers
    environment:
      DB_HOST: purchase-db
      DB_PORT: 5432
      DB_USER: ${PURCHASE_DB_USER:-postgres}
      DB_PASSWORD: ${PURCHASE_DB_PASSWORD:-postgres}
      DB_NAME: ${PURCHASE_DB_NAME:-purchase}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      TOUR_SERVICE_URL: http://tour-app:8080
      NATS_HOST: ${NATS_HOST:-nats}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_USER: ${NATS_USER:-natscon}
      NATS_PASSWORD: ${NATS_PASSWORD:-admin}
      TOUR_SERVICE_GRPC_ADDR: tour-app:50051
    depends_on:
      purchase-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8086:8083"
    logging: *fluent-bit

  purchase-db:
    container_name: purchase-db
    image: postgres:16-alpine
    restart: always
    networks:
      - servers
    environment:
      POSTGRES_USER: ${PURCHASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PURCHASE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PURCHASE_DB_NAME:-purchase}
    ports:
      - "5436:5432"
    volumes:
      - purchase_pg_data:/var/lib/postgresql/data
      - ./init/postgres/purchases:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PURCHASE_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *fluent-bit

  reservation-app:
    build:
      context: .
      dockerfile: ./reservation-service/Dockerfile
    container_name: reservation-app
    restart: on-failure
    networks:
      - servers
    environment:
      DB_HOST: reservation-db
      DB_PORT: 5432
      DB_USER: ${RESERVATION_DB_USER:-postgres}
      DB_PASSWORD: ${RESERVATION_DB_PASSWORD:-postgres}
      DB_NAME: ${RESERVATION_DB_NAME:-reservation}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      TOUR_SERVICE_GRPC_ADDR: tour-app:50051
      NATS_HOST: ${NATS_HOST:-nats}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_USER: ${NATS_USER:-natscon}
      NATS_PASSWORD: ${NATS_PASSWORD:-admin}
    depends_on:
      reservation-db:
        condition: service_healthy
    logging: *fluent-bit

  reservation-db:
    container_name: reservation-db
    image: postgres:16-alpine
    restart: always
    networks:
      - servers
    environment:
      POSTGRES_USER: ${RESERVATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${RESERVATION_DB_NAME:-reservation}
    ports:
      - "5437:5432"
    volumes:
      - reservation_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESERVATION_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *fluent-bit

  api-gateway:
    image: nginx:stable-alpine
    container_name: api-gateway
    networks:
      - servers
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - blog-app
      - stakeholders-app
      - tour-app
      - followers-app
      - purchase-app
      - fluent-bit

  blog-db:
    container_name: blog-db
    image: mongo:7.0.3
    restart: always
    networks:
      - servers
    environment:
      MONGO_INITDB_DATABASE: ${BLOG_DB_NAME:-blog}
    ports:
      - "27018:27017"
    volumes:
      - blog_mongo_data:/data/db
      - ./init/mongodb/blog:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *fluent-bit
    
  followers-app:
    build:
      context: .
      dockerfile: ./followers-service/Dockerfile
    container_name: followers-app
    restart: on-failure
    networks:
      - servers
    environment:
      NEO4J_URI: bolt://followers-db:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: 50051
      NATS_HOST: ${NATS_HOST:-nats}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_USER: ${NATS_USER:-natscon}
      NATS_PASSWORD: ${NATS_PASSWORD:-admin}
    depends_on:
      followers-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    logging: *fluent-bit

  followers-db:
    container_name: followers-db
    image: neo4j:5-community
    restart: always
    networks:
      - servers
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-rootroot}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - followers_neo4j_data:/data
      - ./init/neo4j/followers:/docker-entrypoint-initdb.d:Z
    entrypoint: >
      bash -c "
        /startup/docker-entrypoint.sh neo4j &
        /docker-entrypoint-initdb.d/init.sh &&
        wait
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *fluent-bit

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - servers
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - servers
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    networks:
      - servers
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - servers
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  nats:
    image: nats:alpine
    container_name: nats
    restart: on-failure
    networks:
      - servers
    command: ["-m", "8222", "--user", "${NATS_USER:-natscon}", "--pass", "${NATS_PASSWORD:-admin}"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    networks:
      - servers
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  loki:
    image: grafana/loki:latest
    container_name: loki
    networks:
      - servers

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:latest
    container_name: fluent-bit
    user: root
    volumes:
      - ./monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:Z
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - servers

volumes:
  stakeholders_pg_data:
  blog_mongo_data:
  tour_pg_data:
  purchase_pg_data:
  followers_neo4j_data:
  grafana_data:
  reservation_pg_data:

networks:
  servers:
    name: servers
    driver: bridge
